[package]
name = "investigator"
version = "0.1.0"
description = "INVESTigator — personal investment intelligence (TypeScript engine)"
authors = ["João Serrão"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "investigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# The engine's platform interfaces map onto these four plugins (see src/adapter.ts):
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
# Email delivery: SMTP from Rust (the WebView can't open a TLS socket itself).
# rustls (pure Rust, bundled webpki roots) so it cross-compiles to BOTH Windows and
# Android. native-tls would need OpenSSL on Android, which can't cross-compile; ring
# (rustls' backend) already builds here — reqwest pulls it in on desktop too.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
